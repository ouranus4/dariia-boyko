<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Галерея події — Daria Boyko</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Manrope:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f7f8fb;--ink:#0f1c3f;--ink-2:#3b4666;--muted:#7d879f;
  --line:rgba(15,28,63,.13);--blue:#2b4bd6;--blue-2:#1b2f96;--sky:#e8eff9;
  --pad:clamp(16px,4vw,56px);
  --sans:"Manrope",system-ui,sans-serif;--serif:"Cormorant Garamond",Georgia,serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:var(--blue);color:#fff}

.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px var(--pad);background:rgba(247,248,251,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--serif);font-size:27px;line-height:1}
.logo small{display:block;font-family:var(--sans);font-weight:500;font-size:8.5px;letter-spacing:.38em;text-transform:uppercase;margin-top:6px;opacity:.75}
.back{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--blue)}
.back:hover{color:var(--blue-2)}

.head{padding:clamp(50px,8vw,110px) var(--pad) clamp(30px,4vw,50px);display:flex;justify-content:space-between;align-items:end;gap:30px;flex-wrap:wrap}
.eyebrow{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:600;color:var(--blue);margin-bottom:20px}
.eyebrow::before{content:"";width:28px;height:1px;background:currentColor}
h1{font-family:var(--serif);font-weight:300;font-size:clamp(44px,6.4vw,104px);line-height:.98;letter-spacing:-.02em}
.head p{max-width:360px;font-size:14.5px;color:var(--ink-2)}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1vw,16px);padding:0 var(--pad) clamp(60px,7vw,100px)}
.grid figure{position:relative;overflow:hidden;margin:0;background:#dfe6f3;aspect-ratio:3/4;cursor:zoom-in;opacity:0;transform:translateY(26px);transition:opacity 1s cubic-bezier(.16,1,.3,1),transform 1s cubic-bezier(.16,1,.3,1)}
.grid figure.in{opacity:1;transform:none}
.grid img{width:100%;height:100%;object-fit:cover;transition:transform 1.3s cubic-bezier(.16,1,.3,1)}
.grid figure:hover img{transform:scale(1.05)}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}

.more{border-top:1px solid var(--line);padding:clamp(50px,6vw,90px) var(--pad) clamp(70px,8vw,120px)}
.more h2{font-family:var(--serif);font-weight:300;font-size:clamp(30px,3.4vw,52px);margin-bottom:30px}
.more-row{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(14px,1.6vw,26px)}
.more-card{position:relative;overflow:hidden;aspect-ratio:16/8;background:#dfe6f3}
.more-card img{width:100%;height:100%;object-fit:cover;transition:transform 1.3s cubic-bezier(.16,1,.3,1)}
.more-card:hover img{transform:scale(1.05)}
.more-card b{position:absolute;left:0;right:0;bottom:0;padding:60px 22px 20px;color:#fff;font-family:var(--serif);font-weight:300;font-size:clamp(22px,2vw,30px);background:linear-gradient(transparent,rgba(8,16,40,.8))}
@media (max-width:820px){.more-row{grid-template-columns:1fr}}

.cta{background:linear-gradient(160deg,#2b4bd6,#1b2f96);color:#fff;padding:clamp(60px,7vw,110px) var(--pad);display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}
.cta h2{font-family:var(--serif);font-weight:300;font-size:clamp(34px,4.4vw,72px);line-height:1}
.cta h2 em{font-style:italic;color:#cfdcff}
.cta a{display:inline-flex;align-items:center;gap:16px;min-height:60px;padding:0 32px;background:#fff;color:var(--blue);font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;border-radius:2px;transition:background .3s,color .3s}
.cta a:hover{background:#cfdcff}

.lb{position:fixed;inset:0;z-index:120;background:rgba(10,18,42,.94);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .45s}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:min(92vw,1300px);max-height:84svh;object-fit:contain;box-shadow:0 40px 90px rgba(0,0,0,.5);transform:scale(.96);transition:transform .6s cubic-bezier(.16,1,.3,1),opacity .3s}
.lb.on img{transform:none}
.lb button{position:absolute;color:#fff;width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.3);font-size:20px;display:grid;place-items:center;transition:background .3s}
.lb button:hover{background:rgba(255,255,255,.12)}
.lb .lb-x{top:22px;right:22px}.lb .lb-p{left:22px;top:50%;margin-top:-27px}.lb .lb-n{right:22px;top:50%;margin-top:-27px}
.lb-count{position:absolute;bottom:26px;left:0;right:0;text-align:center;color:rgba(255,255,255,.7);font-size:11px;letter-spacing:.3em}
@media (max-width:820px){.lb .lb-p,.lb .lb-n{top:auto;bottom:18px;margin:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}.grid figure{opacity:1;transform:none}}
</style>
</head>
<body>

<header class="nav">
  <a href="index.html" class="logo">Daria Boyko<small>Event planner</small></a>
  <a href="index.html#gallery" class="back">← До всіх подій</a>
</header>

<section class="head">
  <div>
    <p class="eyebrow" id="kind">Портфоліо</p>
    <h1 id="title">Подія</h1>
  </div>
  <p id="sub"></p>
</section>

<div class="grid" id="grid"></div>

<section class="more">
  <h2>Інші події</h2>
  <div class="more-row" id="more"></div>
</section>

<section class="cta">
  <h2>Хочете так само?<br><em>Забронюймо вашу дату</em></h2>
  <a href="index.html#top">Забронювати дату →</a>
</section>

<div class="lb" id="lb" aria-hidden="true"><img alt=""><button class="lb-x" aria-label="Закрити">×</button><button class="lb-p" aria-label="Попереднє">←</button><button class="lb-n" aria-label="Наступне">→</button><div class="lb-count"></div></div>

<script>
const EVENTS={
  '1':{title:'Весілля у палаці',kind:'Весілля · повна координація',sub:'Ранок у палаці, рожеве серце з живих квітів, полуничний торт і фінал із бенгальськими вогнями.',n:20,cover:17},
  '2':{title:'Весілля на березі озера',kind:'Весілля · організація та координація',sub:'Квіткова арка над водою, синій дим на церемонії та перший танець у хмарах.',n:14,cover:13},
  '3':{title:'Гендер-паті',kind:'Приватна подія',sub:'Рожево-блакитний дим у зеленому тунелі, кортеж і солодкий стіл у пастельних кольорах.',n:7,cover:6}
};
const id=(new URLSearchParams(location.search).get('e')||'1');
const ev=EVENTS[id]||EVENTS['1'];
document.title=ev.title+' — Daria Boyko';
document.getElementById('title').textContent=ev.title;
document.getElementById('kind').textContent=ev.kind;
document.getElementById('sub').textContent=ev.sub;

const grid=document.getElementById('grid');
const pad=n=>String(n).padStart(2,'0');
grid.innerHTML=Array.from({length:ev.n},(_,i)=>
  `<figure><img src="img/gal/${id}/t${pad(i)}.jpg" data-full="img/gal/${id}/${pad(i)}.jpg" alt="${ev.title} — фото ${i+1}" loading="lazy"></figure>`).join('');

const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.1});
grid.querySelectorAll('figure').forEach((f,i)=>{f.style.transitionDelay=(i%3)*.08+'s';io.observe(f)});

document.getElementById('more').innerHTML=Object.entries(EVENTS).filter(([k])=>k!==id)
  .map(([k,e])=>`<a class="more-card" href="gallery.html?e=${k}"><img src="img/gal/${k}/t${pad(e.cover)}.jpg" alt="${e.title}" loading="lazy"><b>${e.title}</b></a>`).join('');

// lightbox
const lb=document.getElementById('lb'),img=lb.querySelector('img'),cnt=lb.querySelector('.lb-count');
const list=[...grid.querySelectorAll('img')];let cur=0;
const show=i=>{cur=(i+list.length)%list.length;const src=list[cur].dataset.full;img.style.opacity=0;
  const n=new Image();n.onload=()=>{img.src=src;img.style.opacity=1};n.src=src;cnt.textContent=`${cur+1} / ${list.length}`};
const close=()=>{lb.classList.remove('on');document.body.style.overflow=''};
list.forEach((el,i)=>el.addEventListener('click',()=>{show(i);lb.classList.add('on');document.body.style.overflow='hidden'}));
lb.querySelector('.lb-x').onclick=close;
lb.querySelector('.lb-p').onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector('.lb-n').onclick=e=>{e.stopPropagation();show(cur+1)};
lb.addEventListener('click',e=>{if(e.target===lb)close()});
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
let sx=null;lb.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
lb.addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)show(cur+(dx<0?1:-1));sx=null});
</script>
<script src="demo.js" defer></script>
</body>
</html>
